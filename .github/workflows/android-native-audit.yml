name: Android release native audit and genuine screenshots
on:
  workflow_dispatch:
    inputs:
      payload_path:
        required: true
        type: string
      payload_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  audit:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FN_ANDROID_AUDIT_KEY: ${{ secrets.FN_ANDROID_AUDIT_KEY }}
      FN_PAYLOAD_PATH: ${{ inputs.payload_path }}
      FN_PAYLOAD_SHA256: ${{ inputs.payload_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare APK from the validated store bundle
        run: node scripts/release/android-audit.mjs prepare
      - name: Allow KVM on the disposable runner
        run: sudo chmod 666 /dev/kvm
      - name: Exercise actual Android UI
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/release/android-audit.py > "$RUNNER_TEMP/footnation-android-audit/ui.log" 2>&1
      - name: Encrypt audit evidence and remove temporary app data
        if: always()
        run: node scripts/release/android-audit.mjs finalize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: footnation-android-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/footnation-android-proof/*
          retention-days: 1
          compression-level: 0
